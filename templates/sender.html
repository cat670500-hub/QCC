<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>發送端 - Portable 收發訊息</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="container">
        <h1>發送端</h1>
        <div style="background: rgba(14, 165, 233, 0.1); border: 1px solid rgba(14, 165, 233, 0.2); padding: 12px 20px; border-radius: 12px; margin-bottom: 20px; font-size: 0.9rem; display: flex; align-items: center; justify-content: space-between; gap: 10px;">
            <span style="color: #0ea5e9; font-weight: 600;">📱 智慧型手機請點選右側，安裝為「語音控制行動端 App」！</span>
            <a href="/mobile" target="_blank" style="background: #0ea5e9; color: white; text-decoration: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; font-size: 0.85rem; box-shadow: 0 2px 4px rgba(14, 165, 233, 0.3);">前往行動端</a>
        </div>
        <div class="glass-panel">
            <h2>待發送清單</h2>
            <button id="refreshBtn" onclick="manualRefresh()" style="margin-bottom: 15px; background: #007BFF; border: none; border-radius: 8px; padding: 10px 16px; color: white; cursor: pointer; font-size: 14px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">🔄 重新查詢</button>
            <div id="patientListDiv" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; max-height: 350px; overflow-y: auto; padding-right: 10px;">
                {% for p in patients %}
                <div class="request-box" style="margin: 0; border-left: 5px solid {% if p.checked_in %}#10b981{% else %}var(--primary){% endif %}; flex-direction: column; align-items: flex-start; transition: border-left-color 0.3s;">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; width: 100%;">
                        <span>
                            <strong>檢查部位: {{ p.exam }}</strong><br>
                            病患: {{ p.name }} ({{ p.record_no }})<br>
                            床號: {% if p.bed == '急診' %}<span style="color: red; font-weight: bold;">{{ p.bed }}</span>{% else %}{{ p.bed }}{% endif %}
                        </span>
                        {% if p.checked_in %}
                            <span class="checked-in-badge" style="background: rgba(16, 185, 129, 0.15); color: #10b981; padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; display: flex; align-items: center; gap: 4px;">✅ 已報到</span>
                        {% endif %}
                    </div>
                    <div style="display: flex; gap: 8px; margin-top: 10px; width: 100%;">
                        {% if not p.checked_in %}
                            <button class="checkInBtn" style="padding: 6px 12px; font-size: 0.85rem; background: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: all 0.2s;" data-record="{{ p.record_no }}" data-exam="{{ p.exam }}" onclick="checkInPatient(this)">報到</button>
                        {% endif %}
                        <button class="sendBtn" style="padding: 6px 12px; font-size: 0.85rem; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: all 0.2s;" data-name="{{ p.name }}" data-record="{{ p.record_no }}" data-bed="{{ p.bed }}" data-exam="{{ p.exam }}" onclick="sendRequest(this)">發送</button>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
        <div id="requestsList" class="status"></div>
        <hr style="border: 0; border-top: 1px solid rgba(0,0,0,0.1); margin: 20px 0;">
        <h3 style="font-size: 1.1rem; color: #444; margin-bottom: 10px;">確認紀錄清單</h3>
        <ul id="historyList"
            style="text-align: left; font-size: 0.9rem; color: #555; max-height: 150px; overflow-y: auto; padding-left: 20px; margin: 0;">
        </ul>
    </div>

    <script>
        const socket = io();
        let requestCount = 0;

        function sendRequest(btn) {
            requestCount++;
            const patient = {
                name: btn.getAttribute('data-name'),
                record_no: btn.getAttribute('data-record'),
                bed: btn.getAttribute('data-bed'),
                exam: btn.getAttribute('data-exam')
            };
            const reqId = 'REQ-' + requestCount;

            // Add to UI as waiting
            const reqDiv = document.createElement('div');
            reqDiv.className = 'request-box waiting';
            reqDiv.id = reqId;
            reqDiv.setAttribute('data-name', patient.name);
            reqDiv.setAttribute('data-bed', patient.bed);
            reqDiv.setAttribute('data-record', patient.record_no);

            const textSpan = document.createElement('span');
            const bedDisplay = patient.bed === '急診' ? `<span style="color: red; font-weight: bold;">${patient.bed}</span>` : patient.bed;
            textSpan.innerHTML = `<strong>[等待中] 發送給接收端</strong><br><strong>檢查部位: ${patient.exam}</strong><br>病患: ${patient.name} (${patient.record_no})<br>床號: ${bedDisplay}`;
            reqDiv.appendChild(textSpan);
            document.getElementById('requestsList').appendChild(reqDiv);

            // Emit to server
            socket.emit('send_request', { id: reqId, patient: patient });
            
            // 發送後隱藏按鈕，避免重複發送
            const parentBox = btn.closest('.request-box');
            if (parentBox) {
                parentBox.remove();
            } else {
                btn.style.display = 'none';
            }
        }

        socket.on('request_confirmed', (data) => {
            const reqDiv = document.getElementById(data.id);
            let displayNameAndBed = `請求 ${data.id}`;
            
            if (reqDiv) {
                const pName = reqDiv.getAttribute('data-name') || '';
                const pBed = reqDiv.getAttribute('data-bed') || '';
                const pRecord = reqDiv.getAttribute('data-record') || '';
                if (pName || pBed || pRecord) {
                    displayNameAndBed = `${pName} (${pRecord}) - ${pBed}`;
                }
                reqDiv.className = 'request-box confirmed';
                reqDiv.querySelector('span').innerText = `${displayNameAndBed} - 接受！`;
                
                // 變成淡藍色框(已確認)後，30秒後清除
                setTimeout(() => {
                    if (reqDiv.parentNode) reqDiv.remove();
                }, 30000);
            }

            // 記錄到清單
            const historyList = document.getElementById('historyList');
            const li = document.createElement('li');
            const timeString = new Date().toLocaleTimeString('zh-TW', { hour12: false });
            li.innerText = `[${timeString}] ${displayNameAndBed} 回覆：接受`;
            li.style.marginBottom = '5px';
            historyList.appendChild(li);
            // 滾動到最底部
            historyList.scrollTop = historyList.scrollHeight;
        });

        // 渲染單個病患卡片的 DOM 結構
        function renderPatientCard(p) {
            const reqDiv = document.createElement('div');
            reqDiv.className = 'request-box';
            reqDiv.style.margin = '0';
            reqDiv.style.flexDirection = 'column';
            reqDiv.style.alignItems = 'flex-start';
            reqDiv.style.borderLeft = p.checked_in ? '5px solid #10b981' : '5px solid var(--primary)';
            reqDiv.style.transition = 'border-left-color 0.3s';
            
            const headerDiv = document.createElement('div');
            headerDiv.style.display = 'flex';
            headerDiv.style.justifyContent = 'space-between';
            headerDiv.style.alignItems = 'flex-start';
            headerDiv.style.width = '100%';
            
            const textSpan = document.createElement('span');
            const bedDisplay = p.bed === '急診' ? `<span style="color: red; font-weight: bold;">${p.bed}</span>` : p.bed;
            textSpan.innerHTML = `<strong>檢查部位: ${p.exam}</strong><br>病患: ${p.name} (${p.record_no})<br>床號: ${bedDisplay}`;
            headerDiv.appendChild(textSpan);
            
            if (p.checked_in) {
                const badge = document.createElement('span');
                badge.className = 'checked-in-badge';
                badge.style.background = 'rgba(16, 185, 129, 0.15)';
                badge.style.color = '#10b981';
                badge.style.padding = '4px 8px';
                badge.style.borderRadius = '6px';
                badge.style.fontSize = '0.8rem';
                badge.style.fontWeight = 'bold';
                badge.style.display = 'flex';
                badge.style.alignItems = 'center';
                badge.style.gap = '4px';
                badge.innerText = '✅ 已報到';
                headerDiv.appendChild(badge);
            }
            reqDiv.appendChild(headerDiv);
            
            const btnGroup = document.createElement('div');
            btnGroup.style.display = 'flex';
            btnGroup.style.gap = '8px';
            btnGroup.style.marginTop = '10px';
            btnGroup.style.width = '100%';
            
            if (!p.checked_in) {
                const checkInBtn = document.createElement('button');
                checkInBtn.className = 'checkInBtn';
                checkInBtn.style.padding = '6px 12px';
                checkInBtn.style.fontSize = '0.85rem';
                checkInBtn.style.background = '#10b981';
                checkInBtn.style.color = 'white';
                checkInBtn.style.border = 'none';
                checkInBtn.style.borderRadius = '6px';
                checkInBtn.style.cursor = 'pointer';
                checkInBtn.style.fontWeight = 'bold';
                checkInBtn.style.transition = 'all 0.2s';
                checkInBtn.setAttribute('data-record', p.record_no);
                checkInBtn.setAttribute('data-exam', p.exam);
                checkInBtn.innerText = '報到';
                checkInBtn.onclick = function() { checkInPatient(this); };
                btnGroup.appendChild(checkInBtn);
            }
            
            const sendBtn = document.createElement('button');
            sendBtn.className = 'sendBtn';
            sendBtn.style.padding = '6px 12px';
            sendBtn.style.fontSize = '0.85rem';
            sendBtn.style.background = 'var(--primary)';
            sendBtn.style.color = 'white';
            sendBtn.style.border = 'none';
            sendBtn.style.borderRadius = '6px';
            sendBtn.style.cursor = 'pointer';
            sendBtn.style.fontWeight = 'bold';
            sendBtn.style.transition = 'all 0.2s';
            sendBtn.setAttribute('data-name', p.name);
            sendBtn.setAttribute('data-record', p.record_no);
            sendBtn.setAttribute('data-bed', p.bed);
            sendBtn.setAttribute('data-exam', p.exam);
            sendBtn.innerText = '發送';
            sendBtn.onclick = function() { sendRequest(this); };
            btnGroup.appendChild(sendBtn);
            
            reqDiv.appendChild(btnGroup);
            return reqDiv;
        }

        // 手動報到觸發
        function checkInPatient(btn) {
            const recordNo = btn.getAttribute('data-record');
            const exam = btn.getAttribute('data-exam');
            
            btn.innerText = '⏳ 處理中...';
            btn.disabled = true;
            
            // 透過 Socket 傳遞報到事件
            socket.emit('check_in_patient', { record_no: recordNo, exam: exam });
        }

        // 監聽來自伺服器的名單更新 (當爬蟲抓到新資料或有人點擊報到時觸發)
        socket.on('patients_updated', (data) => {
            const listDiv = document.getElementById('patientListDiv');
            listDiv.innerHTML = ''; // 清除舊清單
            data.forEach(p => {
                listDiv.appendChild(renderPatientCard(p));
            });
            console.log("已接收最新病患名單，畫面已同步更新！");
        });

        // 向伺服器要求一次最新名單
        function fetchPatients() {
            fetch('/api/patients')
                .then(res => res.json())
                .then(data => {
                    const listDiv = document.getElementById('patientListDiv');
                    listDiv.innerHTML = ''; // 清除舊清單
                    data.forEach(p => {
                        listDiv.appendChild(renderPatientCard(p));
                    });
                })
                .catch(err => console.error("更新失敗:", err));
        }

        function manualRefresh() {
            fetchPatients();
            const btn = document.getElementById('refreshBtn');
            if (btn) {
                btn.innerText = '✅ 已手動更新！';
                btn.disabled = true;
                setTimeout(() => {
                    btn.innerText = '🔄 重新查詢';
                    btn.disabled = false;
                }, 1500);
            }
        }
    </script>
</body>

</html>
